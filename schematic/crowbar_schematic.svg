<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 980" width="1660" height="980" font-family="Arial, Helvetica, sans-serif">
<title>Crowbar Circuit - Netlist Aligned Schematic</title>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0,0 10,4 0,8" fill="#263238"/>
  </marker>
  <style>
    .bg { fill: #fafafa; }
    .box { fill: #ffffff; stroke: #263238; stroke-width: 2; rx: 10; }
    .box-power { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 10; }
    .box-control { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 10; }
    .box-driver { fill: #fce4ec; stroke: #ad1457; stroke-width: 2; rx: 10; }
    .box-output { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 10; }
    .zone { fill-opacity: 0.22; stroke-dasharray: 6,4; stroke-width: 1.5; rx: 12; }
    .zone-power { fill: #ffe0b2; stroke: #ef6c00; }
    .zone-control { fill: #bbdefb; stroke: #1565c0; }
    .wire { stroke: #263238; stroke-width: 2.2; fill: none; }
    .wire-bus { stroke: #c62828; stroke-width: 3.2; fill: none; }
    .wire-dashed { stroke: #455a64; stroke-width: 2; stroke-dasharray: 8,5; fill: none; }
    .arrow { marker-end: url(#arrow); }
    .node { fill: #263238; }
    .title { font-size: 28px; fill: #111; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #37474f; }
    .h1 { font-size: 16px; fill: #111; font-weight: 700; }
    .h2 { font-size: 13px; fill: #111; font-weight: 700; }
    .label { font-size: 12px; fill: #263238; }
    .small { font-size: 11px; fill: #455a64; }
    .note { font-size: 12px; fill: #4e342e; }
    .warn { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.7; rx: 8; }
  </style>
</defs>
<rect x="0" y="0" width="1660" height="980" class="bg" rx="0"/>
<text x="830" y="44" class="title" text-anchor="middle">Crowbar Overvoltage Protection - Netlist Aligned Schematic</text>
<text x="830" y="68" class="subtitle" text-anchor="middle">3-Phase 240V L-L input | F1A/F1B/F1C 3A | SCR1 crowbar + SCR2 output isolation</text>
<rect x="24" y="90" width="1612" height="340" class="zone zone-power" rx="10"/>
<rect x="24" y="450" width="1612" height="300" class="zone zone-control" rx="10"/>
<text x="42" y="112" class="h2" text-anchor="start">Power path</text>
<text x="42" y="472" class="h2" text-anchor="start">Control and trip path</text>
<rect x="50" y="145" width="210" height="95" class="box-power" rx="10"/>
<text x="155.0" y="171" class="h2" text-anchor="middle">3-Phase Source</text>
<text x="155.0" y="191" class="small" text-anchor="middle">A, B, C phases</text>
<text x="155.0" y="206" class="small" text-anchor="middle">240V line-to-line</text>
<rect x="300" y="145" width="210" height="95" class="box-power" rx="10"/>
<text x="405.0" y="171" class="h2" text-anchor="middle">Phase Fuses</text>
<text x="405.0" y="191" class="small" text-anchor="middle">F1A, F1B, F1C</text>
<text x="405.0" y="206" class="small" text-anchor="middle">3A each</text>
<rect x="550" y="145" width="220" height="95" class="box-power" rx="10"/>
<text x="660.0" y="171" class="h2" text-anchor="middle">Bridge Rectifier</text>
<text x="660.0" y="191" class="small" text-anchor="middle">D1..D6</text>
<text x="660.0" y="206" class="small" text-anchor="middle">3-phase 6-pulse</text>
<rect x="820" y="145" width="220" height="95" class="box-power" rx="10"/>
<text x="930.0" y="171" class="h2" text-anchor="middle">HV_BUS</text>
<text x="930.0" y="191" class="small" text-anchor="middle">Crowbar node</text>
<text x="930.0" y="206" class="small" text-anchor="middle">V_isense at rect_pos-&gt;hv_bus</text>
<rect x="1085" y="145" width="250" height="95" class="box-output" rx="10"/>
<text x="1210.0" y="171" class="h2" text-anchor="middle">SCR2 as Diode</text>
<text x="1210.0" y="191" class="small" text-anchor="middle">B_scr_diode</text>
<text x="1210.0" y="206" class="small" text-anchor="middle">Forward HV_BUS-&gt;DC_OUT</text>
<rect x="1370" y="145" width="240" height="95" class="box-output" rx="10"/>
<text x="1490.0" y="171" class="h2" text-anchor="middle">DC_OUT</text>
<text x="1490.0" y="191" class="small" text-anchor="middle">C_OUT 1000uF / 600V</text>
<text x="1490.0" y="206" class="small" text-anchor="middle">R_LOAD to return</text>
<line x1="260" y1="192" x2="300" y2="192" class="wire arrow"/>
<line x1="510" y1="192" x2="550" y2="192" class="wire arrow"/>
<line x1="770" y1="192" x2="820" y2="192" class="wire arrow"/>
<line x1="1040" y1="192" x2="1085" y2="192" class="wire arrow"/>
<line x1="1335" y1="192" x2="1370" y2="192" class="wire arrow"/>
<circle cx="820" cy="192" r="3.8" class="node"/>
<circle cx="1040" cy="192" r="3.8" class="node"/>
<circle cx="1085" cy="192" r="3.8" class="node"/>
<circle cx="1335" cy="192" r="3.8" class="node"/>
<circle cx="1370" cy="192" r="3.8" class="node"/>
<rect x="760" y="280" width="200" height="90" class="box-power" rx="10"/>
<text x="860.0" y="306" class="h2" text-anchor="middle">MOV1 Clamp</text>
<text x="860.0" y="326" class="small" text-anchor="middle">Across HV_BUS to return</text>
<text x="860.0" y="341" class="small" text-anchor="middle">480V class</text>
<rect x="980" y="275" width="210" height="110" class="box-driver" rx="10"/>
<text x="1085.0" y="301" class="h2" text-anchor="middle">SCR1 Crowbar</text>
<text x="1085.0" y="321" class="small" text-anchor="middle">A=HV_BUS, K=return</text>
<text x="1085.0" y="336" class="small" text-anchor="middle">G=scr_gate</text>
<rect x="1230" y="280" width="200" height="90" class="box-power" rx="10"/>
<text x="1330.0" y="306" class="h2" text-anchor="middle">Snubber</text>
<text x="1330.0" y="326" class="small" text-anchor="middle">R9 47R + C2 0.47uF</text>
<text x="1330.0" y="341" class="small" text-anchor="middle">Across SCR1 path</text>
<line x1="930" y1="240" x2="930" y2="275" class="wire-bus"/>
<line x1="930" y1="240" x2="860" y2="280" class="wire"/>
<line x1="930" y1="240" x2="1330" y2="280" class="wire"/>
<line x1="1085" y1="240" x2="1085" y2="275" class="wire"/>
<line x1="560" y1="412" x2="1540" y2="412" class="wire-bus"/>
<text x="1550" y="416" class="small" text-anchor="start">Return / rectifier negative / ground reference</text>
<line x1="860" y1="370" x2="860" y2="412" class="wire"/>
<line x1="1085" y1="385" x2="1085" y2="412" class="wire-bus"/>
<line x1="1330" y1="370" x2="1330" y2="412" class="wire"/>
<circle cx="860" cy="412" r="3.8" class="node"/>
<circle cx="1085" cy="412" r="3.8" class="node"/>
<circle cx="1330" cy="412" r="3.8" class="node"/>
<rect x="1370" y="275" width="240" height="110" class="box-output" rx="10"/>
<text x="1490.0" y="301" class="h2" text-anchor="middle">Output Stage</text>
<text x="1490.0" y="321" class="small" text-anchor="middle">C_OUT = 1000uF, 600V</text>
<text x="1490.0" y="336" class="small" text-anchor="middle">R_LOAD = 330R (simulation)</text>
<line x1="1490" y1="240" x2="1490" y2="275" class="wire"/>
<line x1="1490" y1="385" x2="1490" y2="412" class="wire"/>
<rect x="1005" y="425" width="605" height="62" class="warn" rx="10"/>
<text x="1020" y="450" class="h2" text-anchor="start">SCR2 isolation behavior:</text>
<text x="1020" y="470" class="note" text-anchor="start">When SCR1 crowbars HV_BUS, SCR2 blocks reverse current so C_OUT does not discharge into crowbar.</text>
<rect x="80" y="520" width="340" height="145" class="box-control" rx="10"/>
<text x="250.0" y="546" class="h2" text-anchor="middle">Sensing Network (from DC_OUT)</text>
<text x="250.0" y="566" class="small" text-anchor="middle">R1a 910k + R1b 910k</text>
<text x="250.0" y="581" class="small" text-anchor="middle">R2 10.15k and C3 1nF</text>
<text x="250.0" y="596" class="small" text-anchor="middle">REF node to TL431</text>
<rect x="460" y="520" width="320" height="145" class="box-control" rx="10"/>
<text x="620.0" y="546" class="h2" text-anchor="middle">Local Supply (from DC_OUT)</text>
<text x="620.0" y="566" class="small" text-anchor="middle">R3 47k + R4 47k</text>
<text x="620.0" y="581" class="small" text-anchor="middle">ZD1 15V, C1 1uF, C4 100nF</text>
<rect x="820" y="505" width="400" height="175" class="box-driver" rx="10"/>
<text x="1020.0" y="531" class="h2" text-anchor="middle">TL431 + Driver</text>
<text x="1020.0" y="551" class="small" text-anchor="middle">TL431 cathode via R5</text>
<text x="1020.0" y="566" class="small" text-anchor="middle">Q1 PNP via R6 + ZD2 clamp</text>
<text x="1020.0" y="581" class="small" text-anchor="middle">R7 drives SCR gate</text>
<rect x="1260" y="525" width="320" height="140" class="box-driver" rx="10"/>
<text x="1420.0" y="551" class="h2" text-anchor="middle">SCR Gate Net</text>
<text x="1420.0" y="571" class="small" text-anchor="middle">R8 gate shunt</text>
<text x="1420.0" y="586" class="small" text-anchor="middle">ZD3 gate clamp</text>
<text x="1420.0" y="601" class="small" text-anchor="middle">scr_gate -&gt; SCR1</text>
<line x1="1490" y1="240" x2="1490" y2="505" class="wire"/>
<line x1="1490" y1="505" x2="250" y2="505" class="wire"/>
<line x1="250" y1="505" x2="250" y2="520" class="wire"/>
<line x1="620" y1="505" x2="620" y2="520" class="wire"/>
<circle cx="250" cy="505" r="3.8" class="node"/>
<circle cx="620" cy="505" r="3.8" class="node"/>
<text x="1498" y="500" class="small" text-anchor="start">DC_OUT sense/supply tap</text>
<line x1="420" y1="590" x2="460" y2="590" class="wire arrow"/>
<line x1="780" y1="590" x2="820" y2="590" class="wire arrow"/>
<line x1="1220" y1="590" x2="1260" y2="590" class="wire arrow"/>
<line x1="1370" y1="525" x2="1085" y2="390" class="wire-dashed arrow"/>
<text x="1215" y="470" class="small" text-anchor="middle">gate drive to SCR1</text>
<rect x="80" y="785" width="1540" height="165" class="box" rx="10"/>
<text x="100" y="812" class="h2" text-anchor="start">Design notes</text>
<text x="100" y="835" class="label" text-anchor="start">1) Topology is aligned to simulation/crowbar_circuit.cir (3-phase bridge, dual-SCR usage).</text>
<text x="100" y="859" class="label" text-anchor="start">2) SCR1 performs crowbar on HV_BUS (pre-isolation); SCR2 is used as a diode from HV_BUS to DC_OUT.</text>
<text x="100" y="883" class="label" text-anchor="start">3) DC_OUT is the protected node with 600V/1000uF capacitor hold-up.</text>
<text x="100" y="907" class="label" text-anchor="start">4) Per-phase 3A fuses are explicitly shown ahead of the bridge.</text>
<text x="100" y="931" class="label" text-anchor="start">5) During fault trip, HV_BUS collapses while DC_OUT remains isolated from crowbar back-discharge.</text>
</svg>
