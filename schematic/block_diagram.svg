<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"
     width="900" height="520" font-family="'Segoe UI', Arial, sans-serif">
<title>Crowbar Circuit Block Diagram</title>
<defs>
  <style>
    .wire { stroke: #222; stroke-width: 2; fill: none; }
    .wire-thick { stroke: #222; stroke-width: 3; fill: none; }
    .wire-bus { stroke: #c62828; stroke-width: 4; fill: none; }
    .comp-body { stroke: #333; stroke-width: 1.8; fill: #fff; }
    .comp-fill { stroke: #333; stroke-width: 1.8; }
    .label { font-size: 11px; fill: #333; }
    .label-sm { font-size: 9.5px; fill: #555; }
    .label-lg { font-size: 13px; fill: #222; font-weight: 600; }
    .label-title { font-size: 18px; fill: #111; font-weight: 700; }
    .label-subtitle { font-size: 12px; fill: #555; }
    .node-dot { fill: #222; }
    .gnd-symbol { stroke: #222; stroke-width: 2; fill: none; }
    .highlight { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; rx: 6; }
    .zone-sense { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1; stroke-dasharray: 4,3; rx: 8; opacity: 0.5; }
    .zone-supply { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1; stroke-dasharray: 4,3; rx: 8; opacity: 0.5; }
    .zone-driver { fill: #fce4ec; stroke: #c62828; stroke-width: 1; stroke-dasharray: 4,3; rx: 8; opacity: 0.5; }
    .zone-power { fill: #fff8e1; stroke: #f57f17; stroke-width: 1; stroke-dasharray: 4,3; rx: 8; opacity: 0.5; }
    .safety-badge { fill: #c62828; }
    .safety-text { font-size: 8px; fill: #fff; font-weight: 700; }
  </style>
  <!-- Resistor (IEC zigzag) -->
  <symbol id="resistor-h" viewBox="0 0 60 20" overflow="visible">
    <polyline points="0,10 8,10 12,2 20,18 28,2 36,18 44,2 52,18 56,10 60,10"
              stroke="#333" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  </symbol>
  <symbol id="resistor-v" viewBox="0 0 20 60" overflow="visible">
    <polyline points="10,0 10,8 2,12 18,20 2,28 18,36 2,44 18,52 10,56 10,60"
              stroke="#333" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
  </symbol>
  <!-- Capacitor -->
  <symbol id="cap-h" viewBox="0 0 30 20" overflow="visible">
    <line x1="0" y1="10" x2="12" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="12" y1="0" x2="12" y2="20" stroke="#333" stroke-width="2.5"/>
    <line x1="18" y1="0" x2="18" y2="20" stroke="#333" stroke-width="2.5"/>
    <line x1="18" y1="10" x2="30" y2="10" stroke="#333" stroke-width="2"/>
  </symbol>
  <symbol id="cap-v" viewBox="0 0 20 30" overflow="visible">
    <line x1="10" y1="0" x2="10" y2="12" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="12" x2="20" y2="12" stroke="#333" stroke-width="2.5"/>
    <line x1="0" y1="18" x2="20" y2="18" stroke="#333" stroke-width="2.5"/>
    <line x1="10" y1="18" x2="10" y2="30" stroke="#333" stroke-width="2"/>
  </symbol>
  <!-- Zener diode (vertical, cathode top) -->
  <symbol id="zener-v" viewBox="0 0 20 30" overflow="visible">
    <line x1="10" y1="0" x2="10" y2="10" stroke="#333" stroke-width="2"/>
    <polygon points="3,10 17,10 10,22" fill="#333" stroke="#333" stroke-width="1"/>
    <polyline points="2,22 18,22 18,19" stroke="#333" stroke-width="2" fill="none"/>
    <line x1="10" y1="22" x2="10" y2="30" stroke="#333" stroke-width="2"/>
  </symbol>
  <!-- Fuse -->
  <symbol id="fuse-h" viewBox="0 0 60 24" overflow="visible">
    <line x1="0" y1="12" x2="10" y2="12" stroke="#333" stroke-width="2"/>
    <rect x="10" y="2" width="40" height="20" rx="3" fill="#fff" stroke="#333" stroke-width="1.8"/>
    <line x1="20" y1="12" x2="40" y2="12" stroke="#333" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="50" y1="12" x2="60" y2="12" stroke="#333" stroke-width="2"/>
  </symbol>
  <!-- Ground symbol -->
  <symbol id="gnd" viewBox="0 0 20 16" overflow="visible">
    <line x1="10" y1="0" x2="10" y2="4" stroke="#222" stroke-width="2"/>
    <line x1="2" y1="4" x2="18" y2="4" stroke="#222" stroke-width="2"/>
    <line x1="5" y1="8" x2="15" y2="8" stroke="#222" stroke-width="2"/>
    <line x1="8" y1="12" x2="12" y2="12" stroke="#222" stroke-width="2"/>
  </symbol>
</defs>
<rect width="900" height="520" fill="#fafafa" rx="0"/>
<text x="450" y="35" class="label-title" text-anchor="middle">Crowbar Overvoltage Protection — Block Diagram</text>
<text x="450" y="55" class="label-subtitle" text-anchor="middle">450V Trigger · 250A SCR · TL431 Sensing</text>
<rect x="30" y="100" width="130" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="95" y="125" class="label-lg" text-anchor="middle">HV Source</text>
<text x="95" y="142" class="label-sm" text-anchor="middle">(up to 500V)</text>
<rect x="210" y="100" width="100" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="260" y="125" class="label-lg" text-anchor="middle">F1: Fuse</text>
<text x="260" y="142" class="label-sm" text-anchor="middle">300A / 500VDC</text>
<circle cx="210" cy="100" r="7" class="safety-badge"/>
<text x="210" y="103" class="safety-text" text-anchor="middle">1</text>
<rect x="360" y="100" width="100" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="410" y="125" class="label-lg" text-anchor="middle">HV Bus</text>
<text x="410" y="142" class="label-sm" text-anchor="middle">Node</text>
<rect x="720" y="100" width="130" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="785" y="125" class="label-lg" text-anchor="middle">Protected</text>
<text x="785" y="142" class="label-sm" text-anchor="middle">Load</text>
<line x1="160" y1="130" x2="205" y2="130" class="wire-thick" marker-end="url(#arrowhead)"/>
<line x1="310" y1="130" x2="355" y2="130" class="wire-thick" marker-end="url(#arrowhead)"/>
<line x1="460" y1="130" x2="715" y2="130" class="wire-thick" marker-end="url(#arrowhead)"/>
<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#222"/></marker></defs>
<rect x="30" y="220" width="120" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="90" y="245" class="label-lg" text-anchor="middle">MOV1</text>
<text x="90" y="262" class="label-sm" text-anchor="middle">480V Clamp</text>
<circle cx="30" cy="220" r="7" class="safety-badge"/>
<text x="30" y="223" class="safety-text" text-anchor="middle">2</text>
<rect x="180" y="220" width="150" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="255" y="245" class="label-lg" text-anchor="middle">Sensing Divider</text>
<text x="255" y="262" class="label-sm" text-anchor="middle">R1a+R1b / R2+VR1</text>
<rect x="360" y="220" width="140" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="430" y="245" class="label-lg" text-anchor="middle">Local 15V</text>
<text x="430" y="262" class="label-sm" text-anchor="middle">R3+R4, ZD1, C1</text>
<rect x="530" y="220" width="120" height="60" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
<text x="590" y="245" class="label-lg" text-anchor="middle">Snubber</text>
<text x="590" y="262" class="label-sm" text-anchor="middle">R9 + C2</text>
<circle cx="530" cy="220" r="7" class="safety-badge"/>
<text x="530" y="223" class="safety-text" text-anchor="middle">3</text>
<line x1="90" y1="160" x2="90" y2="220" class="wire"/>
<line x1="255" y1="160" x2="255" y2="220" class="wire"/>
<line x1="430" y1="160" x2="430" y2="220" class="wire"/>
<line x1="590" y1="160" x2="590" y2="220" class="wire"/>
<line x1="410" y1="160" x2="410" y2="175" class="wire"/>
<line x1="90" y1="175" x2="590" y2="175" class="wire-bus"/>
<circle cx="90" cy="175" r="3.5" class="node-dot"/>
<circle cx="255" cy="175" r="3.5" class="node-dot"/>
<circle cx="410" cy="175" r="3.5" class="node-dot"/>
<circle cx="430" cy="175" r="3.5" class="node-dot"/>
<circle cx="590" cy="175" r="3.5" class="node-dot"/>
<rect x="180" y="340" width="120" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="240" y="365" class="label-lg" text-anchor="middle">TL431</text>
<text x="240" y="382" class="label-sm" text-anchor="middle">Vref = 2.495V</text>
<rect x="360" y="340" width="140" height="60" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
<text x="430" y="365" class="label-lg" text-anchor="middle">PNP Driver</text>
<text x="430" y="382" class="label-sm" text-anchor="middle">Q1 + R6, R7, ZD2</text>
<rect x="560" y="340" width="130" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
<text x="625" y="365" class="label-lg" text-anchor="middle">SCR 250A</text>
<text x="625" y="382" class="label-sm" text-anchor="middle">≥800V VDRM</text>
<line x1="255" y1="280" x2="240" y2="335" class="wire-thick" marker-end="url(#arrowhead)"/>
<text x="230" y="300" class="label-sm" text-anchor="middle">V_ref</text>
<line x1="430" y1="280" x2="430" y2="335" class="wire-thick" marker-end="url(#arrowhead)"/>
<text x="448" y="300" class="label-sm" text-anchor="middle">15V</text>
<line x1="300" y1="370" x2="355" y2="370" class="wire-thick" marker-end="url(#arrowhead)"/>
<text x="328" y="362" class="label-sm" text-anchor="middle">Cathode</text>
<line x1="500" y1="370" x2="555" y2="370" class="wire-thick" marker-end="url(#arrowhead)"/>
<text x="528" y="362" class="label-sm" text-anchor="middle">Gate</text>
<line x1="625" y1="340" x2="625" y2="175" class="wire-bus"/>
<circle cx="625" cy="175" r="3.5" class="node-dot"/>
<text x="638" y="330" class="label-sm" text-anchor="start">Anode</text>
<line x1="30" y1="460" x2="700" y2="460" class="wire"/>
<text x="720" y="465" class="label-lg" text-anchor="start">GND</text>
<line x1="90" y1="400" x2="90" y2="460" class="wire"/>
<circle cx="90" cy="460" r="3.5" class="node-dot"/>
<line x1="255" y1="400" x2="255" y2="460" class="wire"/>
<circle cx="255" cy="460" r="3.5" class="node-dot"/>
<line x1="430" y1="400" x2="430" y2="460" class="wire"/>
<circle cx="430" cy="460" r="3.5" class="node-dot"/>
<line x1="590" y1="400" x2="590" y2="460" class="wire"/>
<circle cx="590" cy="460" r="3.5" class="node-dot"/>
<line x1="625" y1="400" x2="625" y2="460" class="wire"/>
<circle cx="625" cy="460" r="3.5" class="node-dot"/>
<text x="90" y="478" class="label-sm" text-anchor="middle">MOV</text>
<text x="255" y="478" class="label-sm" text-anchor="middle">Sense</text>
<text x="430" y="478" class="label-sm" text-anchor="middle">Supply</text>
<text x="590" y="478" class="label-sm" text-anchor="middle">Snubber</text>
<text x="625" y="478" class="label-sm" text-anchor="middle">SCR-K</text>
<text x="450" y="500" class="label-sm" text-anchor="middle">Signal flow: HV Bus → Sensing Divider → TL431 REF → TL431 Cathode → PNP Gate Driver → SCR Gate → CROWBAR</text>
</svg>
