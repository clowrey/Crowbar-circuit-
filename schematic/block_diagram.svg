<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="1440" height="680" font-family="Arial, Helvetica, sans-serif">
<title>3-Phase Crowbar Block Diagram</title>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0,0 10,4 0,8" fill="#263238"/>
  </marker>
  <style>
    .bg { fill: #fafafa; }
    .box { fill: #ffffff; stroke: #263238; stroke-width: 2; rx: 10; }
    .box-power { fill: #fff3e0; stroke: #e65100; stroke-width: 2; rx: 10; }
    .box-control { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 10; }
    .box-driver { fill: #fce4ec; stroke: #ad1457; stroke-width: 2; rx: 10; }
    .box-output { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 10; }
    .zone { fill-opacity: 0.22; stroke-dasharray: 6,4; stroke-width: 1.5; rx: 12; }
    .zone-power { fill: #ffe0b2; stroke: #ef6c00; }
    .zone-control { fill: #bbdefb; stroke: #1565c0; }
    .wire { stroke: #263238; stroke-width: 2.2; fill: none; }
    .wire-bus { stroke: #c62828; stroke-width: 3.2; fill: none; }
    .wire-dashed { stroke: #455a64; stroke-width: 2; stroke-dasharray: 8,5; fill: none; }
    .arrow { marker-end: url(#arrow); }
    .node { fill: #263238; }
    .title { font-size: 28px; fill: #111; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #37474f; }
    .h1 { font-size: 16px; fill: #111; font-weight: 700; }
    .h2 { font-size: 13px; fill: #111; font-weight: 700; }
    .label { font-size: 12px; fill: #263238; }
    .small { font-size: 11px; fill: #455a64; }
    .note { font-size: 12px; fill: #4e342e; }
    .warn { fill: #fff8e1; stroke: #ef6c00; stroke-width: 1.7; rx: 8; }
  </style>
</defs>
<rect x="0" y="0" width="1440" height="680" class="bg" rx="0"/>
<text x="720" y="42" class="title" text-anchor="middle">Crowbar Overvoltage Protection - Refined Front End</text>
<text x="720" y="66" class="subtitle" text-anchor="middle">240V L-L 3-Phase Input | F1A/F1B/F1C 3A | SCR2 Output Isolation</text>
<rect x="40" y="110" width="220" height="92" class="box-power" rx="10"/>
<text x="150.0" y="136" class="h2" text-anchor="middle">3-Phase Input</text>
<text x="150.0" y="156" class="small" text-anchor="middle">240V line-to-line</text>
<text x="150.0" y="171" class="small" text-anchor="middle">A/B/C phases</text>
<rect x="300" y="110" width="190" height="92" class="box-power" rx="10"/>
<text x="395.0" y="136" class="h2" text-anchor="middle">Per-Phase Fusing</text>
<text x="395.0" y="156" class="small" text-anchor="middle">F1A, F1B, F1C</text>
<text x="395.0" y="171" class="small" text-anchor="middle">3A each</text>
<rect x="530" y="110" width="200" height="92" class="box-power" rx="10"/>
<text x="630.0" y="136" class="h2" text-anchor="middle">6-Diode Bridge</text>
<text x="630.0" y="156" class="small" text-anchor="middle">D1..D6 rectifier</text>
<text x="630.0" y="171" class="small" text-anchor="middle">AC to DC</text>
<rect x="770" y="110" width="210" height="92" class="box-power" rx="10"/>
<text x="875.0" y="136" class="h2" text-anchor="middle">HV_BUS</text>
<text x="875.0" y="156" class="small" text-anchor="middle">Rectifier + crowbar node</text>
<text x="875.0" y="171" class="small" text-anchor="middle">MOV + SCR1 + snubber</text>
<rect x="1020" y="110" width="210" height="92" class="box-output" rx="10"/>
<text x="1125.0" y="136" class="h2" text-anchor="middle">SCR2 as Diode</text>
<text x="1125.0" y="156" class="small" text-anchor="middle">Forward: HV_BUS -&gt; DC_OUT</text>
<text x="1125.0" y="171" class="small" text-anchor="middle">Reverse blocked</text>
<rect x="1270" y="110" width="130" height="92" class="box-output" rx="10"/>
<text x="1335.0" y="136" class="h2" text-anchor="middle">DC_OUT</text>
<text x="1335.0" y="156" class="small" text-anchor="middle">C_OUT 1000uF, 600V</text>
<text x="1335.0" y="171" class="small" text-anchor="middle">Protected load bus</text>
<line x1="260" y1="156.0" x2="300" y2="156.0" class="wire arrow"/>
<line x1="490" y1="156.0" x2="530" y2="156.0" class="wire arrow"/>
<line x1="730" y1="156.0" x2="770" y2="156.0" class="wire arrow"/>
<line x1="980" y1="156.0" x2="1020" y2="156.0" class="wire arrow"/>
<line x1="1230" y1="156.0" x2="1270" y2="156.0" class="wire arrow"/>
<rect x="760" y="250" width="220" height="90" class="box-driver" rx="10"/>
<text x="870.0" y="276" class="h2" text-anchor="middle">SCR1 Crowbar Path</text>
<text x="870.0" y="296" class="small" text-anchor="middle">SCR1 (dual module)</text>
<text x="870.0" y="311" class="small" text-anchor="middle">HV_BUS to return</text>
<rect x="1010" y="250" width="220" height="90" class="box-power" rx="10"/>
<text x="1120.0" y="276" class="h2" text-anchor="middle">RC + MOV Protection</text>
<text x="1120.0" y="296" class="small" text-anchor="middle">R9=47R, C2=0.47uF</text>
<text x="1120.0" y="311" class="small" text-anchor="middle">MOV1 clamp</text>
<line x1="875" y1="202" x2="875" y2="250" class="wire-bus"/>
<line x1="875" y1="295" x2="875" y2="360" class="wire-bus"/>
<line x1="1120" y1="202" x2="1120" y2="250" class="wire"/>
<line x1="720" y1="360" x2="1320" y2="360" class="wire"/>
<text x="1330" y="364" class="small" text-anchor="start">Return / GND bus</text>
<rect x="90" y="430" width="310" height="100" class="box-control" rx="10"/>
<text x="245.0" y="456" class="h2" text-anchor="middle">Voltage Sense</text>
<text x="245.0" y="476" class="small" text-anchor="middle">R1a + R1b + R2</text>
<text x="245.0" y="491" class="small" text-anchor="middle">C3 filter</text>
<text x="245.0" y="506" class="small" text-anchor="middle">Trip at ~450V</text>
<rect x="430" y="430" width="290" height="100" class="box-control" rx="10"/>
<text x="575.0" y="456" class="h2" text-anchor="middle">Local Rail</text>
<text x="575.0" y="476" class="small" text-anchor="middle">R3 + R4 + ZD1</text>
<text x="575.0" y="491" class="small" text-anchor="middle">C1 + C4 decoupling</text>
<rect x="760" y="420" width="320" height="120" class="box-driver" rx="10"/>
<text x="920.0" y="446" class="h2" text-anchor="middle">TL431 + Q1 Driver</text>
<text x="920.0" y="466" class="small" text-anchor="middle">TL431 compares REF</text>
<text x="920.0" y="481" class="small" text-anchor="middle">Q1 drives SCR1 gate</text>
<rect x="1110" y="435" width="270" height="90" class="box-driver" rx="10"/>
<text x="1245.0" y="461" class="h2" text-anchor="middle">Gate Network</text>
<text x="1245.0" y="481" class="small" text-anchor="middle">R7, R8, ZD2, ZD3</text>
<line x1="1335" y1="202" x2="1335" y2="430" class="wire"/>
<line x1="1335" y1="430" x2="245" y2="430" class="wire"/>
<line x1="245" y1="430" x2="245" y2="429" class="wire"/>
<line x1="400" y1="480" x2="430" y2="480" class="wire arrow"/>
<line x1="720" y1="480" x2="760" y2="480" class="wire arrow"/>
<line x1="1080" y1="480" x2="1110" y2="480" class="wire arrow"/>
<line x1="1245" y1="435" x2="920" y2="340" class="wire-dashed arrow"/>
<text x="935" y="370" class="small" text-anchor="middle">SCR1 gate drive</text>
<rect x="80" y="575" width="1280" height="78" class="warn" rx="10"/>
<text x="95" y="602" class="h2" text-anchor="start">Key refinement:</text>
<text x="95" y="624" class="note" text-anchor="start">SCR2 is used as an output diode so C_OUT cannot discharge backward through the crowbar after SCR1 fires.</text>
<text x="95" y="644" class="note" text-anchor="start">Simulation now shows HV_BUS collapse while DC_OUT remains elevated and decays through load.</text>
</svg>
